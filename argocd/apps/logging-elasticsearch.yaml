apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging-elasticsearch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.elastic.co
    chart: elasticsearch
    targetRevision: "8.5.1"
    helm:
      values: |
        replicas: 1
        minimumMasterNodes: 1
        esJavaOpts: "-Xmx512m -Xms512m"
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "1.5Gi"
        volumeClaimTemplate:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
        extraEnvs:
          - name: xpack.security.enabled
            value: "false"
        protocol: http
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true