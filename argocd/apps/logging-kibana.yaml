apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging-kibana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/0mar1010/DevOps-Final-Project
    targetRevision: main
    path: charts/kibana
    helm:
      values: |
        elasticsearchHosts: "http://elasticsearch-master:9200"
        elasticsearchCredentialSecret: kibana-system-credentials
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
          ingress:
            enabled: true
            className: traefik
            hosts:
              - host: kibana.local
                paths:
                  - path: /                elasticsearchHosts: "https://elasticsearch-master:9200"
        extraEnvs:
          - name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES
            value: /usr/share/kibana/config/certs/ca.crt
          - name: SERVER_HOST
            value: "0.0.0.0"
          - name: NODE_OPTIONS
            value: "--max-old-space-size=1800"
        
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true