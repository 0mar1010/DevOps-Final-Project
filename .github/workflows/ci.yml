name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "K8s/overlays/**"
      - ".gitlab-ci.yml"
      - "*.md"
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.service == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend lint and test
        if: matrix.service == 'backend'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest -r requirements.txt
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv
          flake8 . --count --exit-zero --max-line-length=127 --statistics --exclude=venv,.venv
          if [ -d tests ]; then pytest; else echo "no tests yet"; fi

      - name: Set up Node
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend install, lint and test
        if: matrix.service == 'frontend'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm test --if-present -- --passWithNoTests

  build-scan-push:
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      IMAGE: ghcr.io/0mar1010/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (kept local until the scan has run)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/0mar1010/DevOps-Final-Project

      - name: Trivy scan (pinned container image, report only)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.69.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            "$IMAGE:${{ github.sha }}"

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  update-tag:
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set new image tags in the staging overlay
        working-directory: K8s/overlays/staging
        run: |
          kustomize edit set image \
            backend=ghcr.io/0mar1010/backend:${{ github.sha }} \
            frontend=ghcr.io/0mar1010/frontend:${{ github.sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add K8s/overlays/staging/kustomization.yaml
          git commit -m "ci: deploy ${{ github.sha }} [skip ci]" || echo "nothing to commit"
          git pull --rebase
          git push
