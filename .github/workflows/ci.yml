name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "K8s/overlays/**"      # tag-bump commits (step 5) won't retrigger CI
      - "*.md"
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: 0mar1010

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Backend lint and test
        if: matrix.service == 'backend'
        working-directory: backend
        run: |
          pip install flake8 pytest -r requirements.txt
          flake8 . --max-line-length=120 --exclude=venv
          if [ -d tests ]; then pytest; else echo "no tests yet"; fi

      - name: Frontend lint and test
        if: matrix.service == 'frontend'
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present -- --watchAll=false

  build-scan-push:
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:${{ github.sha }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "0"      # report only; change to "1" once findings are fixed

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          IMG=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}
          docker tag $IMG:${{ github.sha }} $IMG:latest
          docker push $IMG:${{ github.sha }}
          docker push $IMG:latest
  update-tag:
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set new image tags
        working-directory: K8s/overlays/staging
        run: |
          kustomize edit set image \
            backend=ghcr.io/0mar1010/backend:${{ github.sha }} \
            frontend=ghcr.io/0mar1010/frontend:${{ github.sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add K8s/overlays/staging/kustomization.yaml
          git commit -m "ci: deploy ${{ github.sha }} [skip ci]" || echo "nothing to commit"
          git push
